services:
  db:
    image: postgres:16
    container_name: tribo3-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tribo3}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tribo3_dev}
      POSTGRES_DB: ${POSTGRES_DB:-tribo3}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - tribo3_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tribo3} -d ${POSTGRES_DB:-tribo3}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Aplica as migrations de ./migrations em ordem (V1__, V2__, ...) toda
  # vez que o compose sobe. Idempotente: migration já aplicada é pulada.
  migrate:
    image: flyway/flyway:10
    container_name: tribo3-migrate
    depends_on:
      db:
        condition: service_healthy
    command: -url=jdbc:postgresql://db:5432/${POSTGRES_DB:-tribo3} -user=${POSTGRES_USER:-tribo3} -password=${POSTGRES_PASSWORD:-tribo3_dev} -connectRetries=10 migrate
    volumes:
      - ./migrations:/flyway/sql

  # Popula o banco assim que as migrations terminam: gera a massa
  # sintética no schema `staging`, roda o pipeline de qualidade e promove
  # as linhas aprovadas para as tabelas tipadas.
  #
  # Idempotente: se já houver dados, o seed.py detecta e não faz nada —
  # rodar `up` de novo não duplica o dataset. Para repopular do zero use
  # `docker compose down -v`.
  seed:
    build: ./scripts
    container_name: tribo3-seed
    depends_on:
      migrate:
        # O Flyway sai com código 0 quando termina; sem esperar por isso o
        # gerador tentaria escrever em tabelas que ainda não existem.
        condition: service_completed_successfully
    restart: "no"
    environment:
      PGHOST: db
      PGPORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-tribo3}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tribo3_dev}
      POSTGRES_DB: ${POSTGRES_DB:-tribo3}
      N_PARTICIPANTES: ${N_PARTICIPANTES:-300}
      SEED: ${SEED:-42}
      DATA_REFERENCIA: ${DATA_REFERENCIA:-}

  # Interface visual pra qualquer pessoa do time inspecionar o banco
  # sem precisar de client instalado localmente.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tribo3-pgadmin
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-dev@tribo3.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-tribo3_dev}
    ports:
      - "5050:80"
    volumes:
      - tribo3_pgadmin:/var/lib/pgadmin

volumes:
  tribo3_pgdata:
  tribo3_pgadmin:
